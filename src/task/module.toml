# src/task/module.toml
# Task launcher module: scan/build/launch/report/collect (ported from dsh-task-launcher).
# Peer of src/debate/ (S22 symmetry): pure logic lives here, host wiring in src/index.ts.
# TS sources are not counted by vendored orphan checks (only .py/.ps1 + dirs),
# so submodules stays empty; TS files are documented in architecture.md §4.2.

[module]
name = "src/task"
description = "Cross-repo task launcher: structure scan, material build, grouped session launch."
submodules = []
require_invariants = true

[public_api]
exposed = []
reason = "No facade: routes in src/index.ts import these modules directly (same-process wiring)."

# Semantic red lines for the task pure modules (S20: placeholder replaced by live binds).
[[invariant.pure.rules]]
id = "PURE-01"
desc = "Three pure modules keep their exported entry points; every module keeps a vitest mirror."
test_ref = "tests/src/task/test_invariants.py::test_task_pure_surface_exists"
