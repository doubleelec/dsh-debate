# src/module.toml
# Module-level manifest (arch retrofit baseline).
# Governs direct children of src/. TS sources are not counted by the
# vendored orphan check (only .py/.ps1 + dirs), so submodules lists only
# the nested governed directory; TS files are documented in architecture.md §4.2.

[module]
name = "src"
description = "Debate host, protocol, lenses, live page, and browser bundle."
submodules = [
    "client",
]

[public_api]
exposed = []
reason = "No cross-module facade: single-module plugin, host/client wired via dsh.plugin.json and cordis.patch.yml."
