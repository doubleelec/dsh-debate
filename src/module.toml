# src/module.toml
# Module-level manifest (arch retrofit baseline + S19/S21/S22/S27 reconcile).
# Host wiring module: src/index.ts (single tsdown entry, route table in apply()).
# Pure logic lives in peer submodules debate/ (protocol/lenses/persist) and
# cross_tasks/ (scan/materials/ensure-session); host internals in host/
# (types/cage/resident: S27 P0 extraction); src/version.ts is shared (host/client).
# TS sources are not counted by the vendored orphan check (only .py/.ps1 + dirs),
# so submodules lists only the nested governed directories; wiring vs pure split
# is documented in architecture.md §4.2 (see ADR-0025 §7 for why wiring is not split).

[module]
name = "src"
description = "Debate host, protocol, lenses, browser bundle, and cross-repo task launcher."
submodules = [
    "client",
    "debate",
    "cross_tasks",
    "host",
]
require_invariants = true

[public_api]
exposed = []
reason = "No cross-module facade: single-module plugin, host/client wired via dsh.plugin.json and cordis.patch.yml."

# Semantic red lines for the host half (S20: placeholders replaced by live binds;
# S22: debate pure guards moved to src/debate/module.toml DEBATE-01).
# Host route surface must not drift without a guard failing.
# (S28: model tool registration removed — human-operated plugin, no tools.register;
# WIRE-01 re-scoped to routes only.)
[[invariant.wiring.rules]]
id = "WIRE-01"
desc = "Host route surface is locked: 9 deliberation routes, 7 task routes; no model tools registered."
test_ref = "tests/src/test_invariants.py::test_src_registered_tools_match_manifest"

[[invariant.cage.rules]]
id = "CAGE-01"
desc = "Debater allowlist is exactly the six read-only tools, synth three; closed by construction."
test_ref = "tests/src/test_invariants.py::test_src_debater_tool_allowlist_is_closed"

[[invariant.symmetry.rules]]
id = "SYM-01"
desc = "debate/ vs cross_tasks/ stay peer pure-logic submodules; host wiring stays in index.ts + host/."
test_ref = "tests/src/test_invariants.py::test_src_peer_symmetry"
