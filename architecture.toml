# dsh-debate architecture.toml
# Top-level Architecture-as-Code manifest (arch retrofit baseline + S18/S19/S21 reconcile).
# Single governed tree: src (host + protocol + task wiring) with nested
# src/client (browser bundle) and src/task (cross-repo task pure modules).
# tests/ holds the vitest behavior suite + vendored governance suite + per-module invariant mirrors.

submodules = [
    "src",
]

[module.src]
description = "Debate host + protocol + live page."
external_depends = []
internal_depends = []
